name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical data
        run: python apworld/data.py

      - name: Install client dependencies
        run: python -m pip install -r pc-client/requirements.txt

      - name: Run standalone tests
        run: python -m unittest discover -s pc-client -p "test_*.py"

      - name: Install release builder
        run: python -m pip install pyinstaller

      - name: Build apworld
        run: python scripts/build_apworld.py

      - name: Build bridge executable
        run: python scripts/build_executables.py --skip-helper

      - uses: actions/upload-artifact@v4
        with:
          name: wii-sports-resort-build
          path: |
            dist/wii_sports_resort.apworld
            dist/WSR.Dolphin.Bridge.exe

      - name: Restore private Mii database
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RFL_01: ${{ secrets.RFL_DB_DAT_BASE64_01 }}
          RFL_02: ${{ secrets.RFL_DB_DAT_BASE64_02 }}
          RFL_03: ${{ secrets.RFL_DB_DAT_BASE64_03 }}
          RFL_04: ${{ secrets.RFL_DB_DAT_BASE64_04 }}
          RFL_05: ${{ secrets.RFL_DB_DAT_BASE64_05 }}
          RFL_06: ${{ secrets.RFL_DB_DAT_BASE64_06 }}
          RFL_07: ${{ secrets.RFL_DB_DAT_BASE64_07 }}
          RFL_08: ${{ secrets.RFL_DB_DAT_BASE64_08 }}
          RFL_09: ${{ secrets.RFL_DB_DAT_BASE64_09 }}
          RFL_10: ${{ secrets.RFL_DB_DAT_BASE64_10 }}
          RFL_11: ${{ secrets.RFL_DB_DAT_BASE64_11 }}
          RFL_12: ${{ secrets.RFL_DB_DAT_BASE64_12 }}
          RFL_13: ${{ secrets.RFL_DB_DAT_BASE64_13 }}
          RFL_14: ${{ secrets.RFL_DB_DAT_BASE64_14 }}
          RFL_15: ${{ secrets.RFL_DB_DAT_BASE64_15 }}
          RFL_16: ${{ secrets.RFL_DB_DAT_BASE64_16 }}
          RFL_17: ${{ secrets.RFL_DB_DAT_BASE64_17 }}
          RFL_18: ${{ secrets.RFL_DB_DAT_BASE64_18 }}
          RFL_19: ${{ secrets.RFL_DB_DAT_BASE64_19 }}
          RFL_20: ${{ secrets.RFL_DB_DAT_BASE64_20 }}
          RFL_21: ${{ secrets.RFL_DB_DAT_BASE64_21 }}
          RFL_22: ${{ secrets.RFL_DB_DAT_BASE64_22 }}
          RFL_23: ${{ secrets.RFL_DB_DAT_BASE64_23 }}
        shell: pwsh
        run: |
          $chunks = 1..23 | ForEach-Object {
            [Environment]::GetEnvironmentVariable(("RFL_{0:D2}" -f $_))
          }
          if ($chunks | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            throw "Missing one or more RFL_DB_DAT_BASE64_XX repository secrets."
          }
          $base64 = $chunks -join ""
          [IO.File]::WriteAllBytes("helpers/RFL_DB.dat", [Convert]::FromBase64String($base64))

      - name: Build setup executable
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/build_executables.py

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/wii_sports_resort.apworld "dist/WSR.Dolphin.Bridge.exe" "dist/WSR.Dolphin.Setup.exe" --generate-notes